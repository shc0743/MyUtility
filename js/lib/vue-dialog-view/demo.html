<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vue-dialog-view Demo</title>
    
    <!-- 添加 importmap 解决依赖解析 -->
    <script type="importmap">
    {
      "imports": {
        "vue": "https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.prod.js",
        "vue-dialog-view": "https://cdn.jsdelivr.net/npm/vue-dialog-view@1.2.0/dist/dialog-view.es.js"
      }
    }
    </script>
    
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #f6f8fa;
      }
      button {
        padding: 0.6em 1.2em;
        border: none;
        border-radius: 8px;
        background-color: #42b983;
        color: white;
        font-size: 1em;
        cursor: pointer;
      }
      button:hover {
        background-color: #2f9d6a;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
import { createApp, ref, h } from 'vue'
import DialogView from 'vue-dialog-view'

const text = `
When good old friends are going away
Will you wish them to remember your name?
When good old days are passing away
Will you promise your heart remains the same
Never can we suspend the time
Having to leave the tracks behind
there is a longer way ahead, After all.
There used to be a story teller
who always painted the sunshine and the rain
One has to eventually grow up
Spending a lifetime to taste the love and pain
Never can we suspend the time
Having to leave the tracks behind
there is a longer way ahead, After all.
If it’s too hard to say goodbye
Give us a try to sing a rhyme
“May you, the beauty of this world, always shine.”

---

The text/content/images referenced herein are from miHoYo and are used for reference purposes only. All rights belong to the original copyright holder.
`

const App = {
  setup() {
    const show = ref(false)
    
    return () => [
      h(
        'button',
        {
          onClick: () => { show.value = true }
        },
        '打开对话框'
      ),
      
      h(
        DialogView,
        {
          modelValue: show.value,
          'onUpdate:modelValue': (value) => { show.value = value },
          showTitleBar: true,
          showCloseButton: true
        },
        {
          title: () => h('div', 'Hello from vue-dialog-view!'),
          default: () => [
            h('p', '这是通过 jsDelivr 引入的对话框组件。'),
            h('p', '你可以点击右上角关闭按钮或按 Esc 来关闭。'),
            h('br'),
            h('pre', text),
          ]
        }
      )
    ]
  }
}

const app = createApp(App)
app.use(DialogView)
app.mount('#app')
    </script>
  </body>
</html>
